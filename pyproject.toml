[project]
name = "async-simple-salesforce"
description = "Async fork of simple-salesforce"
authors = [{name="Erik Aker", email="eaker@mulliganfunding.com"}]
license = {file = "LICENSE.txt"}
readme = "README.md"
requires-python = ">=3.10"
keywords = [
  "uv", "requirements", "packaging"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "aiofiles>=25.1.0",
  "httpcore>=1.0.9",
  "httpx>=0.28.1",
  "more-itertools>=11.0.2",
  "pyjwt[crypto]",
  "requests>=2.33.1",
  "typing-extensions",
  "zeep>=4.3.2",
]
dynamic = [
  "version",
]

[dependency-groups]
dev = [
  "build>=1.4.4",
  "cryptography",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.1.0",
  "pytest-httpx>=0.36.2",
  "pytz>=2026.1.post1",
  "responses>=0.26.0",
  "ruff>=0.15.12",
  "twine>=6.2.0",
  "ty >= 0.0.32",
  "types-aiofiles>=25.1.0.20260409",
  "types-requests>=2.33.0.20260408",
]

[build-system]
requires = ["setuptools", "versioningit"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
mypkg = ["*.wsdl", "*.rst", "*.txt", "*.in", "*.md"]

[tool.versioningit]
default-version = "1.0.0+unknown"

[project.urls]
Repository = "https://github.com/MulliganFunding/async-simple-salesforce"
Documentation = "https://github.com/MulliganFunding/async-simple-salesforce/blob/main/README.md"
Changelog = "https://github.com/MulliganFunding/async-simple-salesforce/blob/main/CHANGELOG.md"
Releases = "https://github.com/MulliganFunding/async-simple-salesforce/releases"

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = "."
addopts = "--cov-report=term-missing:skip-covered --cov=simple_salesforce --cov-report html"
testpaths = [
    "tests",
]

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F"]
ignore = ["E402", "E501"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F"]

unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Ignore `F401` (unused import) for `__init__.py` files.
"__init__.py" = ["F401"]


[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

line-length = 110

target-version = "py313"
