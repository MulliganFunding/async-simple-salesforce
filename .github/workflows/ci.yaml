name: Tests
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '*.rst'

jobs:
  tests:
    env:
      COVERAGE_DIR: ${{ format('/tmp/coverage/{0}', github.run_id) }}
    permissions:
        checks: write
        contents: read
        pull-requests: write

    name: "Python ${{ matrix.python-version }} for ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: "actions/checkout@v6"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libxml2 libxslt

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxslt1-dev

        # Set up environment and run code quality checks
      - name: "Run install deps"
        run: "just bootstrap ${{ matrix.python-version }}"

      # Code quality checks
      - name: "Run code quality checks"
        run: "just check"
      - name: "Run code quality checks"
        run: "just check-types"
      # Test suite
      - name: "Run tests"
        run: "just ci-test ${COVERAGE_DIR}"
        shell: bash
      # Publish code coverage results
      - name: Code Coverage Report
        if: ${{ matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest' }}
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '70 80'

      - name: Add Coverage PR Comment
        if: ${{ matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md

      # Publish junit test result
      - name: Publish Test Report
        if: ${{ matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest' }}
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: ${{ format('/tmp/coverage/{0}/*junit.xml', github.run_id) }}